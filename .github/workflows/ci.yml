name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - name: Commit Prettier output on feature-branch pushes
        if: github.event_name == 'push' && matrix.node-version == 22
        shell: bash
        run: |
          if git diff --quiet -- README.md src/tools/cart.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/tools/cart.ts
          git commit -m "style: apply prettier"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

# The formatter self-commit step is temporary for this feature branch. Remove it
# and restore `npm run format:check` before merging.
# `npm test` is a LIVE smoke test that needs a logged-in browser session and display.
