name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Format documentation
        run: >-
          npx prettier --write
          README.md README.zh-TW.md
          SECURITY.md SECURITY.zh-TW.md
          CHANGELOG.md
          docs/README.md docs/README.zh-TW.md
          docs/CONFIGURATION.md docs/CONFIGURATION.zh-TW.md
          docs/DEVELOPMENT.md docs/DEVELOPMENT.zh-TW.md
          docs/RELEASES.md
      - name: Commit formatted documentation
        if: github.event_name == 'push' && matrix.node-version == 22
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md SECURITY.md SECURITY.zh-TW.md CHANGELOG.md docs/*.md
          git commit -m "style: format documentation"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

# Temporary documentation-formatting pass. Restore `npm run format:check` and
# read-only workflow permissions after the formatter commit lands.
