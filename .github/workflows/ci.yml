name: CI

on:
  push:
    branches: [main, 'sync/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Format Traditional Chinese docs
        run: npx prettier --write README.zh-TW.md SECURITY.zh-TW.md docs/README.zh-TW.md docs/CONFIGURATION.zh-TW.md docs/DEVELOPMENT.zh-TW.md
      - name: Commit formatted docs
        if: matrix.node-version == 22
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.zh-TW.md SECURITY.zh-TW.md docs/README.zh-TW.md docs/CONFIGURATION.zh-TW.md docs/DEVELOPMENT.zh-TW.md
          git commit -m "style: format Traditional Chinese docs"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
