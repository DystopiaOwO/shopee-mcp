name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

# NOTE: the feature branch temporarily runs `npm run format` so typecheck/build/tests
# can run to completion while cart-tool code is being stabilized. Restore
# `npm run format:check` before merging.
# `npm test` is a LIVE smoke test that needs a logged-in browser session and display.
